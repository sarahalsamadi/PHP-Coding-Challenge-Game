<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login and Registration Form </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="wrapper">
        <span class="bg-animate"></span>
        <span class="bg-animate2"></span>
        <div class="form-box login">
            <h2 class="animation" style="--i:0; --j:21">Login</h2>
            <form action="login.php" id="loginForm" method="post">
                <div class="input-box animation" style="--i:1; --j:22">
                    <input id="name" type="text" name="username_reg" required>
                    <label for="name">Username</label>
                    <i class='bxr  bx-user'  ></i> 
                </div>
                <div class="input-box animation" style="--i:2; --j:23">
                    <input id="password" type="password" name="password_reg" required>
                    <label for="password">Password</label>
                    <i class='bxr  bx-lock'  ></i> 
                </div>
                <button type="submit" name="action" value="Login" class="btn animation" style="--i:3; --j:24">Login</button>
                <div class="logreg-link animation" style="--i:4; --j:25">
                    <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                </div>
            </form>
    </div>
    <div class="info-text login">
        <h2 class="animation" style="--i:o; --j:20">Welcome Back!</h2>
        <p class="animation" style="--i:1; --j:21">Lorem ipsum, dolor sit amet consectetur adipisicing . </p>
    </div>

    <div class="form-box register">
            <h2 class="animation" style="--i:17; --j:0">Sign Up</h2>
            <form action="login.php" id="registerForm" method="post">
                <div class="input-box animation" style="--i:18; --j:1">
                    <input id="name" type="text" name="username_reg" required>
                    <label for="name">Username</label>
                    <i class='bxr  bx-user'  ></i>                 </div>
                <div class="input-box animation" style="--i:19; --j:2">
                    <input id="email" type="email" name="email_reg" required>
                    <label for="email">Email</label>
                    <i class='bxr  bx-envelope'  ></i>  
                </div>
                <div class="input-box animation" style="--i:20; --j:3">
                    <input id="password" type="password" name="password_reg" required>
                    <label for="password">Password</label>
                    <i class='bxr  bx-lock'  ></i> 
                </div>
                <button type="submit" name="action" value="Signup" class="btn animation" style="--i:21; --j:4">Sign Up</button>
                <div class="logreg-link animation" style="--i:22; --j:5">
                    <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                </div>
            </form>
    </div>
    <div class="info-text register">
        <h2 class="animation" style="--i:17; --j:0">Welcome Back!</h2>
        <p class="animation" style="--i:18; --j:1">Lorem ipsum, dolor sit amet consectetur adipisicing . </p>
    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
